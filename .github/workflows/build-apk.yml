name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Signed-release keystore generated fresh on every run.
      KEYSTORE_FILE: key.jks
      KEYSTORE_PASSWORD: funnyprank-pw
      KEY_ALIAS: funnyprank
      KEY_PASSWORD: funnyprank-pw
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore key.jks \
            -alias funnyprank \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass funnyprank-pw \
            -keypass funnyprank-pw \
            -dname "CN=FunnyPrank, OU=Mobile, O=FunnyPrank, L=Islamabad, S=Pakistan, C=PK"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunnyPrank-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunnyPrank-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Compute version
        id: version
        run: echo "version=$(date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Funny Prank APK v${{ steps.version.outputs.version }}
          body: |
            Signed release APK (installable) and debug APK.
            - `app-release.apk` — signed, recommended for install (v2/v3 signature)
            - `app-debug.apk` — debug build
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
